name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          token: ${{ secrets.GH_PAT }}
          options: '{"username":"MickLesk","show_icons":true,"theme":"tokyonight","count_private":true,"include_all_commits":true,"hide":"stars","show":"reviews,prs_merged,prs_merged_percentage"}'
          path: profile-stats.svg

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          token: ${{ secrets.GH_PAT }}
          options: '{"username":"MickLesk","layout":"compact","theme":"tokyonight","langs_count":8}'
          path: profile-langs.svg

      - name: Generate ProxmoxVE card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          token: ${{ secrets.GH_PAT }}
          options: '{"username":"community-scripts","repo":"ProxmoxVE","theme":"tokyonight","show_owner":true}'
          path: proxmox-pin.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-stats.svg profile-langs.svg proxmox-pin.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update README stats"
          git push
